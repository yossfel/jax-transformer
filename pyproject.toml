[project]
name = "implementations"
version = "0.1.0"
description = "Encoder-decoder Transformer (Attention Is All You Need) from scratch in pure JAX, trained on Tiny Shakespeare"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.11.2",
    "matplotlib>=3.11.2",
    "optax>=0.2.8",
    "tokenizers>=0.23.3",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda12]>=0.11.2 ; sys_platform == 'linux'",
]
